<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8" />

  <!-- Font clean & SaaS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <title>Forgeblast — Demo Web-to-Lead</title>

  <style>
    :root{
      /* ===== BASE BLANCHE ===== */
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;

      --text: #0f172a;
      --muted: #475569;

      /* ===== BLEUS (charte tech) ===== */
      --primary: #2563eb;        /* bleu principal */
      --primary-soft: #eff6ff;
      --primary-focus: #93c5fd;

      /* ===== CTA ORANGE FORGEBLAST ===== */
      --cta: #F7931E;
      --cta-hover: #FF6101;

      --radius: 14px;
      --font: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .wrap{
      width: 100%;
      max-width: 720px;
    }

    .card{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(15,23,42,.08);
      overflow: hidden;
    }

    .header{
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff, #f8fafc);
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo{
      width: 48px;
      height: 48px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
    }

    .brand-name{
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      line-height: 1.2;
    }

    .brand-sub{
      margin: 4px 0 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    form{
      padding: 24px;
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
      .header, form{ padding: 16px; }
    }

    .field{
      display: grid;
      gap: 6px;
    }

    label{
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .req{
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"]{
      width: 100%;
      padding: 12px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input::placeholder{
      color: #94a3b8;
    }

    input:focus{
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37,99,235,.15);
    }

    .actions{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .hint{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      max-width: 420px;
    }

    button{
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      color: #ffffff;
      background: linear-gradient(90deg, var(--cta), var(--cta-hover));
      box-shadow: 0 10px 24px rgba(247,147,30,.35);
      transition: transform .12s ease, box-shadow .12s ease;
      min-width: 180px;
    }

    button:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(247,147,30,.45);
    }

    button:active{
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(247,147,30,.30);
    }

    .footer-note{
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="brand">
          <!-- Logo à placer dans assets/forgeblast-logo.png -->
          <img src="assets/forgeblast-logo.png" alt="Forgeblast" class="brand-logo">
          <div>
            <h1 class="brand-name">Forgeblast</h1>
            <p class="brand-sub">Demande de démo — Web-to-Lead Salesforce</p>
          </div>
        </div>
      </div>

      <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DJ9000002FKAQ" method="POST">
        <input type="hidden" name="oid" value="00DJ9000002FKAQ">
        <input type="hidden" name="retURL" value="https://forgeblast.com/fr">
        <input type="hidden" name="lead_source" value="Website Demo">

        <div class="grid">
          <div class="field">
            <label for="first_name">Prénom</label>
            <input id="first_name" name="first_name" type="text" placeholder="Ex : Alex">
          </div>

          <div class="field">
            <label for="last_name">Nom <span class="req">requis</span></label>
            <input id="last_name" name="last_name" type="text" required placeholder="Ex : Martin">
          </div>

          <div class="field">
            <label for="email">Adresse e-mail <span class="req">requis</span></label>
            <input id="email" name="email" type="email" required placeholder="alex@entreprise.com">
          </div>

          <div class="field">
            <label for="phone">Téléphone</label>
            <input id="phone" name="phone" type="tel" placeholder="+33 6 00 00 00 00">
          </div>

          <div class="field">
            <label for="company">Société <span class="req">requis</span></label>
            <input id="company" name="company" type="text" required placeholder="Forgeblast">
          </div>

          <div class="field">
            <label for="city">Ville</label>
            <input id="city" name="city" type="text" placeholder="Paris">
          </div>

          <div class="field" style="grid-column:1/-1">
            <label for="state">Région / Province</label>
            <input id="state" name="state" type="text" placeholder="Île-de-France">
          </div>
        </div>

        <div class="actions">
          <p class="hint">
            En soumettant ce formulaire, vous acceptez d’être recontacté par Forgeblast
            dans le cadre d’une démonstration.
          </p>
          <button type="submit">Demander une démo</button>
        </div>
      </form>
    </div>

    <div class="footer-note">
      Démo Web-to-Lead — Salesforce
    </div>
  </div>
</body>
</html>
